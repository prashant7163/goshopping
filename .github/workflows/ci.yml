name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: goshopping
          POSTGRES_USER: goshopping
          POSTGRES_PASSWORD: goshopping
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U goshopping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgres://goshopping:goshopping@localhost:5432/goshopping?sslmode=disable
      # cmd/migrate goes through config.Load, which validates everything at once
      # and refuses to start without this (ADR-018). There is no .env here, so
      # it has to come from the environment. Not a secret: nothing in CI signs a
      # token anyone will ever present.
      JWT_SECRET: ci-only-not-a-real-secret-000000000000
      # The repository tests skip when no database is reachable, which is right
      # on a laptop and wrong here: a green run that tested nothing is worse
      # than no run at all. This turns the skip into a failure (ADR-030).
      REQUIRE_DATABASE: '1'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Apply migrations
        run: go run ./cmd/migrate up

      - name: Test
        run: go test ./...

      # The unit tests cover the repository; this covers the surface a client
      # actually meets, including the rules no single response shows — that both
      # login failures are identical, and that a password change ends every
      # other session while the caller keeps working.
      - name: Auth smoke test
        run: |
          go build -o /tmp/goserver ./cmd/server
          /tmp/goserver &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz >/dev/null || {
            echo "server never became healthy"; exit 1;
          }
          ./scripts/smoke_auth.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # Chromium only: the suite measures how the cascade resolves layers, not
      # how each engine paints, and layers are a well-supported spec.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Guards the MUI/Tailwind layer arrangement (ADR-031), which fails
      # silently — a wrong order flattens every MUI component while the app
      # still builds, type-checks, and lints clean. Runs against both the dev
      # server and the built output, which inject CSS differently.
      - name: Cascade layer checks
        run: npm run test:layers

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
